[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-risk-modeling"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
    "streamlit==1.62.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
