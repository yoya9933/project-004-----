name: Model governance CI

on:
  push:
    branches:
      - refactor/p0-model-governance
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked environment
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Lint
        run: |
          ruff check src/legal_risk_modeling streamlit_app.py \
            04_執行稿/run_reduction_ratio_model_sklearn.py \
            04_執行稿/run_reduction_ratio_model_fast.py \
            04_執行稿/run_is_reduced_classification.py \
            04_執行稿/run_rag_retrieval_benchmark.py \
            04_執行稿/build_rag_human_gold_review.py \
            04_執行稿/run_data_quality_check.py \
            04_執行稿/run_model_data_quality.py tests

      - name: Compile Python sources
        run: |
          python -m compileall -q src streamlit_app.py \
            04_執行稿/run_reduction_ratio_model_sklearn.py \
            04_執行稿/run_reduction_ratio_model_fast.py \
            04_執行稿/run_is_reduced_classification.py \
            04_執行稿/run_rag_retrieval_benchmark.py \
            04_執行稿/build_rag_human_gold_review.py \
            04_執行稿/run_data_quality_check.py \
            04_執行稿/run_model_data_quality.py

      - name: Unit and UI tests
        run: python -m pytest -q

      - name: Verify generated artifact boundary
        run: |
          git check-ignore -q .artifacts/
          test -z "$(git ls-files '.artifacts/**')"
          test -z "$(git ls-files '.streamlit_demo_*.log')"
          test ! -e 04_執行稿/build_keyword_candidate_pools.ps1

      - name: Validate source data quality
        run: |
          python 04_執行稿/run_data_quality_check.py \
            --input-csv 06_交付物/ai_rag_annotation/annotation_workbook.csv \
            --output-json .artifacts/data_quality/annotation_workbook.json

      - name: Validate model-specific data quality
        run: python 04_執行稿/run_model_data_quality.py

      - name: Build active AI and RAG annotation artifacts
        run: |
          python 04_執行稿/build_ai_rag_annotation_pack.py \
            --output-dir .artifacts/ai_rag_annotation

      - name: Build human RAG review queue
        run: |
          python 04_執行稿/build_rag_human_gold_review.py \
            --retrieval-csv .artifacts/ai_rag_annotation/rag_similar_cases.csv \
            --gold-csv 06_交付物/ai_rag_annotation/human_rag_gold.csv \
            --output-csv .artifacts/rag_human_gold/review_queue.csv \
            --top-n 5

      - name: Run RAG retrieval benchmarks
        run: |
          python 04_執行稿/run_rag_retrieval_benchmark.py \
            --retrieval-csv .artifacts/ai_rag_annotation/rag_similar_cases.csv \
            --metadata-csv 06_交付物/ai_rag_annotation/annotation_workbook.csv \
            --human-gold-csv 06_交付物/ai_rag_annotation/human_rag_gold.csv \
            --min-queries 20 \
            --min-hit-rate 0.40 \
            --min-mrr 0.28 \
            --min-human-queries 20 \
            --min-human-ndcg 0.30

      - name: Run governed ratio training
        run: python 04_執行稿/run_reduction_ratio_model_sklearn.py --run-id "ci-ratio-${GITHUB_SHA}"

      - name: Run governed classification pipeline
        run: |
          python 04_執行稿/run_is_reduced_classification.py \
            --input-csv 06_交付物/ai_rag_annotation/annotation_workbook.csv \
            --run-id "ci-classification-${GITHUB_SHA}"

      - name: Validate manifests and governed releases
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          from legal_risk_modeling.manifest import validate_manifest

          root = Path.cwd()
          git_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          artifact_root = root / '.artifacts'
          ratio = artifact_root / 'reduction_ratio_model_expanded_824_sklearn'
          classification = artifact_root / 'is_reduced_classification'
          rag = artifact_root / 'rag_benchmark'
          quality = artifact_root / 'data_quality'
          human_queue = artifact_root / 'rag_human_gold' / 'review_queue.csv'

          required = [
              ratio / 'metrics.csv',
              ratio / 'predictions.csv',
              ratio / 'selected_models.csv',
              ratio / 'tuning_search.csv',
              ratio / 'promotion_report.json',
              ratio / 'approved_release.json',
              ratio / 'manifest.json',
              classification / 'metrics.csv',
              classification / 'predictions.csv',
              classification / 'promotion_report.json',
              classification / 'approved_release.json',
              classification / 'manifest.json',
              rag / 'metrics.json',
              rag / 'per_query.csv',
              rag / 'golden_queries.csv',
              rag / 'human_metrics.json',
              rag / 'human_per_query.csv',
              quality / 'annotation_workbook.json',
              quality / 'classification.json',
              quality / 'ratio.json',
              human_queue,
          ]
          missing = [str(path.relative_to(root)) for path in required if not path.exists()]
          assert not missing, f'missing governed artifacts: {missing}'

          ratio_manifest = validate_manifest(
              project_root=root,
              manifest_path=ratio / 'manifest.json',
              expected_git_sha=git_sha,
              require_clean_git=True,
          )
          classification_manifest = validate_manifest(
              project_root=root,
              manifest_path=classification / 'manifest.json',
              expected_git_sha=git_sha,
              require_clean_git=True,
          )
          assert ratio_manifest['schema_version'] == 2
          assert classification_manifest['schema_version'] == 2
          assert ratio_manifest['temporal_split_policy'] == classification_manifest['temporal_split_policy']
          assert ratio_manifest['runtime']['requirements_lock']['sha256']
          assert classification_manifest['runtime']['requirements_lock']['sha256']

          ratio_release = json.loads((ratio / 'approved_release.json').read_text(encoding='utf-8'))
          ratio_promotion = json.loads((ratio / 'promotion_report.json').read_text(encoding='utf-8'))
          assert ratio_release['status'] == 'approved'
          assert ratio_release['default_model'] == ratio_promotion['default_model']
          assert ratio_release['approved_models'] == ratio_promotion['approved_models']
          assert ratio_release['default_model'] in [ratio_release['baseline'], *ratio_release['approved_models']]

          classification_release = json.loads(
              (classification / 'approved_release.json').read_text(encoding='utf-8')
          )
          classification_promotion = json.loads(
              (classification / 'promotion_report.json').read_text(encoding='utf-8')
          )
          assert classification_release['status'] == 'approved'
          assert classification_release['default_model'] == classification_promotion['default_model']
          assert classification_release['approved_models'] == classification_promotion['approved_models']
          assert classification_release['default_model'] in [
              classification_release['baseline'],
              *classification_release['approved_models'],
          ]

          status = json.loads((classification / 'model_status.json').read_text(encoding='utf-8'))
          assert status['status'] == 'trained'
          assert status['promotion_status'] in {'approved', 'rejected'}
          assert status['release_default_model'] == classification_release['default_model']

          rag_metrics = json.loads((rag / 'metrics.json').read_text(encoding='utf-8'))
          human_metrics = json.loads((rag / 'human_metrics.json').read_text(encoding='utf-8'))
          assert rag_metrics['gold_definition'] == 'structured_proxy_v2'
          assert rag_metrics['query_count'] >= 20
          assert rag_metrics['hit_rate_at_3'] >= 0.40
          assert rag_metrics['mrr_at_3'] >= 0.28
          assert human_metrics['gold_definition'] == 'human_graded_v1'
          assert human_metrics['query_count'] >= 0

          quality_reports = {
              name: json.loads((quality / filename).read_text(encoding='utf-8'))
              for name, filename in {
                  'annotation': 'annotation_workbook.json',
                  'classification': 'classification.json',
                  'ratio': 'ratio.json',
              }.items()
          }
          for name, report in quality_reports.items():
              assert report['status'] == 'pass', (name, report['errors'])

          snapshot = {
              'schema_version': 2,
              'git_sha': git_sha,
              'rag': {'proxy': rag_metrics, 'human': human_metrics},
              'ratio': {
                  'default_model': ratio_release['default_model'],
                  'approved_models': ratio_release['approved_models'],
                  'baseline': ratio_release['baseline'],
              },
              'classification': {
                  'status': status['status'],
                  'promotion_status': status['promotion_status'],
                  'default_model': classification_release['default_model'],
                  'approved_models': classification_release['approved_models'],
                  'labeled_rows': status.get('labeled_rows'),
                  'class_counts': status.get('class_counts', {}),
              },
              'data_quality': {
                  name: {
                      'status': report['status'],
                      'row_count': report['row_count'],
                      'warning_count': len(report.get('warnings', [])),
                      'error_count': len(report.get('errors', [])),
                  }
                  for name, report in quality_reports.items()
              },
          }
          history_dir = artifact_root / 'benchmark_history'
          history_dir.mkdir(parents=True, exist_ok=True)
          snapshot_path = history_dir / f'{git_sha}.json'
          snapshot_path.write_text(json.dumps(snapshot, ensure_ascii=False, indent=2), encoding='utf-8')

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with Path(summary_path).open('a', encoding='utf-8') as handle:
                  handle.write('### Governed benchmark snapshot\n\n')
                  handle.write(
                      f'- RAG proxy @3: HitRate {rag_metrics["hit_rate_at_3"]:.3f}, '
                      f'MRR {rag_metrics["mrr_at_3"]:.3f}\n'
                  )
                  handle.write(
                      f'- RAG human gold: {human_metrics["query_count"]} approved queries, '
                      f'nDCG@3 {human_metrics["ndcg_at_3"]:.3f}\n'
                  )
                  handle.write(f'- Ratio default: `{ratio_release["default_model"]}`\n')
                  handle.write(
                      f'- Classification: **{status["promotion_status"]}**, '
                      f'default `{classification_release["default_model"]}`\n'
                  )
                  handle.write(
                      '- Data quality: '
                      + ', '.join(f'{name}={report["status"]}' for name, report in quality_reports.items())
                      + '\n\n'
                  )

          print(json.dumps(snapshot, ensure_ascii=False, indent=2))
          PY

      - name: Streamlit smoke test
        run: |
          set -euo pipefail
          streamlit run streamlit_app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            > /tmp/streamlit.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              echo
              echo 'Streamlit health check passed.'
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/streamlit.log
              exit 1
            fi
            sleep 1
          done

          cat /tmp/streamlit.log
          exit 1

      - name: Retain governed artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-artifacts-${{ github.sha }}
          path: .artifacts/
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
