name: Model governance CI

on:
  push:
    branches:
      - refactor/p0-model-governance
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked environment
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Lint
        run: |
          ruff check src/legal_risk_modeling streamlit_app.py \
            04_執行稿/run_reduction_ratio_model_sklearn.py \
            04_執行稿/run_reduction_ratio_model_fast.py \
            04_執行稿/run_is_reduced_classification.py \
            04_執行稿/run_rag_retrieval_benchmark.py \
            04_執行稿/run_data_quality_check.py tests

      - name: Compile Python sources
        run: |
          python -m compileall -q src streamlit_app.py \
            04_執行稿/run_reduction_ratio_model_sklearn.py \
            04_執行稿/run_reduction_ratio_model_fast.py \
            04_執行稿/run_is_reduced_classification.py \
            04_執行稿/run_rag_retrieval_benchmark.py \
            04_執行稿/run_data_quality_check.py

      - name: Unit and UI tests
        run: python -m pytest -q

      - name: Verify generated artifact boundary
        run: |
          git check-ignore -q .artifacts/
          test -z "$(git ls-files '.artifacts/**')"
          test -z "$(git ls-files '.streamlit_demo_*.log')"

      - name: Validate source data quality
        run: |
          python 04_執行稿/run_data_quality_check.py \
            --input-csv 06_交付物/ai_rag_annotation/annotation_workbook.csv \
            --output-json .artifacts/data_quality/annotation_workbook.json

      - name: Build active AI and RAG annotation artifacts
        run: |
          python 04_執行稿/build_ai_rag_annotation_pack.py \
            --output-dir .artifacts/ai_rag_annotation

      - name: Run RAG retrieval benchmark
        run: |
          python 04_執行稿/run_rag_retrieval_benchmark.py \
            --retrieval-csv .artifacts/ai_rag_annotation/rag_similar_cases.csv \
            --metadata-csv 06_交付物/ai_rag_annotation/annotation_workbook.csv \
            --min-queries 20 \
            --min-hit-rate 0.40 \
            --min-mrr 0.28

      - name: Run governed ratio training
        run: python 04_執行稿/run_reduction_ratio_model_sklearn.py --run-id "ci-ratio-${GITHUB_SHA}"

      - name: Run governed classification pipeline
        run: |
          python 04_執行稿/run_is_reduced_classification.py \
            --input-csv 06_交付物/ai_rag_annotation/annotation_workbook.csv \
            --run-id "ci-classification-${GITHUB_SHA}"

      - name: Validate manifests and governed release
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          git_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          artifact_root = root / '.artifacts'
          ratio = artifact_root / 'reduction_ratio_model_expanded_824_sklearn'
          classification = artifact_root / 'is_reduced_classification'
          rag = artifact_root / 'rag_benchmark'
          quality_path = artifact_root / 'data_quality' / 'annotation_workbook.json'

          required_ratio = [
              ratio / 'metrics.csv',
              ratio / 'predictions.csv',
              ratio / 'selected_models.csv',
              ratio / 'validation_search.csv',
              ratio / 'promotion_report.json',
              ratio / 'approved_release.json',
              ratio / 'manifest.json',
          ]
          required_rag = [
              rag / 'metrics.json',
              rag / 'per_query.csv',
              rag / 'golden_queries.csv',
          ]
          missing = [
              str(path.relative_to(root))
              for path in [*required_ratio, *required_rag, classification / 'manifest.json', quality_path]
              if not path.exists()
          ]
          assert not missing, f'missing governed artifacts: {missing}'

          release = json.loads((ratio / 'approved_release.json').read_text(encoding='utf-8'))
          promotion = json.loads((ratio / 'promotion_report.json').read_text(encoding='utf-8'))
          assert release['default_model'] == promotion['default_model']
          assert release['approved_models'] == promotion['approved_models']
          assert release['default_model'] in [release['baseline'], *release['approved_models']]

          manifests = [ratio / 'manifest.json', classification / 'manifest.json']
          for manifest_path in manifests:
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              assert manifest.get('git_sha') == git_sha, (manifest_path, manifest.get('git_sha'), git_sha)
              assert manifest.get('datasets'), f'{manifest_path}: datasets missing'
              assert manifest.get('artifacts'), f'{manifest_path}: artifacts missing'
              assert manifest.get('packages'), f'{manifest_path}: packages missing'
              assert manifest.get('model_spec'), f'{manifest_path}: model_spec missing'
              for item in manifest['datasets']:
                  path = root / item['path']
                  assert path.exists(), path
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  assert item['sha256'] == digest, item['path']

          status = json.loads((classification / 'model_status.json').read_text(encoding='utf-8'))
          assert status['status'] in {'trained', 'skipped'}
          rag_metrics = json.loads((rag / 'metrics.json').read_text(encoding='utf-8'))
          assert rag_metrics['gold_definition'] == 'structured_proxy_v2'
          assert rag_metrics['query_count'] >= 20
          assert rag_metrics['hit_rate_at_3'] >= 0.40
          assert rag_metrics['mrr_at_3'] >= 0.28
          quality = json.loads(quality_path.read_text(encoding='utf-8'))
          assert quality['status'] == 'pass', quality['errors']

          snapshot = {
              'schema_version': 1,
              'git_sha': git_sha,
              'rag': rag_metrics,
              'ratio': {
                  'default_model': release['default_model'],
                  'approved_models': release['approved_models'],
                  'baseline': release['baseline'],
              },
              'classification': {
                  'status': status['status'],
                  'model': status.get('model'),
                  'labeled_rows': status.get('labeled_rows'),
                  'class_counts': status.get('class_counts', {}),
              },
              'data_quality': {
                  'status': quality['status'],
                  'row_count': quality['row_count'],
                  'warning_count': len(quality['warnings']),
                  'error_count': len(quality['errors']),
              },
          }
          history_dir = artifact_root / 'benchmark_history'
          history_dir.mkdir(parents=True, exist_ok=True)
          snapshot_path = history_dir / f'{git_sha}.json'
          snapshot_path.write_text(json.dumps(snapshot, ensure_ascii=False, indent=2), encoding='utf-8')

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with Path(summary_path).open('a', encoding='utf-8') as handle:
                  handle.write('### Governed benchmark snapshot\n\n')
                  handle.write(f'- Data quality: **{quality["status"]}** ({quality["row_count"]} rows)\n')
                  handle.write(
                      f'- RAG @3: Precision {rag_metrics["precision_at_3"]:.3f}, '
                      f'Recall {rag_metrics["recall_at_3"]:.3f}, '
                      f'HitRate {rag_metrics["hit_rate_at_3"]:.3f}, '
                      f'MRR {rag_metrics["mrr_at_3"]:.3f}\n'
                  )
                  handle.write(f'- Ratio default: `{release["default_model"]}`\n')
                  handle.write(f'- Classification: **{status["status"]}**, {status.get("labeled_rows", 0)} labeled rows\n\n')

          print(json.dumps(snapshot, ensure_ascii=False, indent=2))
          PY

      - name: Streamlit smoke test
        run: |
          set -euo pipefail
          streamlit run streamlit_app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            > /tmp/streamlit.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              echo
              echo 'Streamlit health check passed.'
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/streamlit.log
              exit 1
            fi
            sleep 1
          done

          cat /tmp/streamlit.log
          exit 1

      - name: Retain governed artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-artifacts-${{ github.sha }}
          path: .artifacts/
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
