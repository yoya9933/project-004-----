name: P0 model governance CI

on:
  push:
    branches:
      - refactor/p0-model-governance
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile Python sources
        run: |
          python -m compileall -q src streamlit_app.py 04_執行稿/run_reduction_ratio_model_sklearn.py

      - name: Run governance tests
        run: |
          python -m pytest -q tests/test_model_governance.py

      - name: Run governed training pipeline
        run: |
          python 04_執行稿/run_reduction_ratio_model_sklearn.py --run-id "ci-${GITHUB_SHA}"

      - name: Validate governed artifacts and manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          out = root / '06_交付物' / 'reduction_ratio_model_expanded_824_sklearn'
          required = [
              out / 'metrics.csv',
              out / 'predictions.csv',
              out / 'selected_models.csv',
              out / 'validation_search.csv',
              out / 'promotion_report.json',
              out / 'approved_release.json',
              out / 'manifest.json',
          ]
          missing = [str(p.relative_to(root)) for p in required if not p.exists()]
          assert not missing, f'missing artifacts: {missing}'

          release = json.loads((out / 'approved_release.json').read_text(encoding='utf-8'))
          promotion = json.loads((out / 'promotion_report.json').read_text(encoding='utf-8'))
          manifest = json.loads((out / 'manifest.json').read_text(encoding='utf-8'))

          assert release['default_model'] == promotion['default_model']
          assert release['approved_models'] == promotion['approved_models']
          allowed = [release['baseline'], *release['approved_models']]
          assert release['default_model'] in allowed

          git_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert manifest.get('git_sha') == git_sha, (manifest.get('git_sha'), git_sha)
          assert manifest.get('datasets'), 'manifest datasets missing'
          assert manifest.get('artifacts'), 'manifest artifacts missing'
          assert manifest.get('packages'), 'manifest package versions missing'
          assert manifest.get('model_spec'), 'manifest model spec missing'

          for item in manifest['datasets']:
              path = root / item['path']
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert item['sha256'] == digest, item['path']

          print(json.dumps({
              'default_model': release['default_model'],
              'approved_models': release['approved_models'],
              'git_sha': git_sha,
              'dataset_count': len(manifest['datasets']),
              'artifact_count': len(manifest['artifacts']),
              'package_count': len(manifest['packages']),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Verify Streamlit contains no training path
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('streamlit_app.py').read_text(encoding='utf-8')
          banned = ['.fit(', 'train_models(', 'run_live_training(', 'LogisticRegression(', 'Ridge(', 'Lasso(']
          found = [token for token in banned if token in text]
          assert not found, f'Streamlit still contains training code: {found}'
          PY

      - name: Streamlit smoke test
        run: |
          set -euo pipefail
          streamlit run streamlit_app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            > /tmp/streamlit.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              echo
              echo 'Streamlit health check passed.'
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'Streamlit exited before becoming healthy.'
              cat /tmp/streamlit.log
              exit 1
            fi
            sleep 1
          done

          echo 'Streamlit did not become healthy in time.'
          cat /tmp/streamlit.log
          exit 1
